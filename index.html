<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Posts — Rust</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d1117;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e6edf3;
    }

    .card {
      text-align: center;
      padding: 3rem 4rem;
      border: 1px solid #30363d;
      border-radius: 12px;
      background-color: #161b22;
      max-width: 520px;
      width: 90%;
    }

    .rust-logo {
      font-size: 3.5rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.4;
      color: #f0f6fc;
      margin-bottom: 0.5rem;
    }

    h1 span {
      color: #f74c00;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #8b949e;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      background-color: #1f2937;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 2rem;
      letter-spacing: 0.5px;
    }

    .badge span {
      color: #f74c00;
      font-weight: 600;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 1.5rem;
      background-color: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .github-link:hover {
      background-color: #30363d;
      border-color: #58a6ff;
      color: #58a6ff;
    }

    .github-link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.78rem;
      color: #484f58;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="rust-logo">🦀</div>
    <h1>API de <span>Rust</span> para<br>crear Posts</h1>
    <p class="subtitle">Aprendiendo a desarrollar APIs robustas<br>con manejo de memoria eficiente</p>
    <div class="badge">actix-web &nbsp;·&nbsp; sqlx &nbsp;·&nbsp; <span>PostgreSQL</span> &nbsp;·&nbsp; JWT</div>
    <br>
    <a class="github-link" href="https://github.com/gamn2090" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
          -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
          .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
          -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
          .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
          .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
          0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      gamn2090
    </a>
    <p class="footer">por gamn2090 · hecho con 🦀 Rust</p>
  </div>
</body>
</html>
